<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:title" content="California Bird Atlas">
<meta property="og:image" content="/img/great-blue-heron.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<div class="strip" id="strip"></div>
<header class="masthead" id="masthead">

  <button class="menu-toggle" id="menu-toggle" aria-label="Open menu" aria-expanded="false"><span></span><span></span></button>

<p class="tategaki" id="tategaki" aria-hidden="true" hidden></p>
<main id="view"><p class="loading">Opening…</p></main>
